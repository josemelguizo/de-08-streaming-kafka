[project]
name = "streaming-aire"
version = "0.1.0"
description = "Streaming de calidad del aire con Kafka, ventanas de tiempo y marcas de agua"
requires-python = ">=3.10"
dependencies = ["confluent-kafka>=2.4", "duckdb>=1.1"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
